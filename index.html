<script>
  // Link & Kunci Asli Supabase Anda (Sudah Diperbaiki)
  const SUPABASE_URL = "https://jvdsghkfahsbmrwzdgec.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_IMzZdxSR_Sy8u8ykVv5Ypw_HwqsaJkA";
  
  // Mengaktifkan koneksi ke database Anda
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Fungsi Akurat untuk Lacak Nota Pelanggan (Contoh Nota: 1221)
  async function lacakStatusLaundry(kodeNota) {
    const { data, error } = await supabase
      .from('pesanan')
      .select('*')
      .eq('kode_lacak', kodeNota); // Mencari baris nota 1221 yang pas

    if (error) {
      console.error("Gagal memuat:", error);
      return "Error koneksi";
    }

    if (data && data.length > 0) {
      // Mengambil baris pertama yang ditemukan secara akurat
      return data[0].status; 
    } else {
      return "Nota tidak ditemukan";
    }
  }
