<meta charset="utf-8">
<!-- >>> TAG KEAMANAN: Content-Security-Policy. Batasi ke mana data boleh dikirim.
     Jika memakai domain Supabase sendiri (bukan *.supabase.co), ganti pada connect-src. Hapus baris ini hanya jika ada fitur yang terblokir. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a73c8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafan Laundry</title>
<link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
</head><body>
<div id="app" class="pgin"></div><div id="toast" style="opacity: 0;"></div>
<script id="data" type="application/json">{"orders":[],"seq":0,"nama":"Kasir Laundry","v":2}</script>
<script>
/* Penangkap error: jika aplikasi gagal jalan, pesan errornya tampil di layar (bukan layar kosong) */
(function(){function t(m){try{var d=document.getElementById('klerr');if(!d){d=document.createElement('pre');d.id='klerr';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:999;margin:0;padding:12px 14px;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:50vh;overflow:auto';(document.body||document.documentElement).appendChild(d)}d.textContent+=m+'\n'}catch(e){}}
window.addEventListener('error',function(e){t('Error: '+(e.message||'')+' ('+String(e.filename||'').split('/').pop()+':'+(e.lineno||'?')+')')});
window.addEventListener('unhandledrejection',function(e){t('Error: '+((e.reason&&e.reason.message)||e.reason))})})();
</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
